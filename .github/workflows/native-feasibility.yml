name: Offline browser and native source-tree gate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-native-project:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Standard source checks
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_browser_core.cjs
          python3 scripts/verify_offline.py
      - name: Install pinned browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Install official native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv xvfb xauth libenchant-2-2 hunspell-en-gb libxcb-cursor0 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-xinerama0 libxcb-render-util0 fonts-noto-cjk
          mkdir -p .native evidence
          python3 -m venv .native/venv
          .native/venv/bin/python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --dest .native novelWriter==26.2.1
          echo '81e65e8e602b798250d4236a6c139ab22b2d2deaca041db110e82b829a15066d  .native/novelwriter-26.2.1-py3-none-any.whl' | sha256sum --check | tee evidence/release-integrity.txt
          .native/venv/bin/python -m pip install --index-url https://pypi.org/simple --only-binary=:all: .native/novelwriter-26.2.1-py3-none-any.whl
          .native/venv/bin/python -m pip freeze > evidence/native-dependencies.txt
      - name: Official GUI fixture and actual offline browser downloads
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: xcb
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1440x1100x24' .native/venv/bin/python scripts/native_gate.py 2>&1 | tee evidence/native.log
          python3 scripts/oracle.py
      - name: Retain native evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: draft-shelf-native-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
